[include fluidd.cfg]

## Fluidd client variables — fixes pause/resume after filament runout
## idle_timeout prevents steppers from disabling during filament swap
## runout_sensor lets RESUME check filament is loaded before continuing
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False
variable_custom_park_x    : 0.0
variable_custom_park_y    : 0.0
variable_custom_park_dz   : 2.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False
variable_park_at_cancel_x : None
variable_park_at_cancel_y : None
variable_use_fw_retract   : False
variable_idle_timeout     : 1800
variable_runout_sensor    : "filament_motion_sensor sfs_motion"
gcode:

[idle_timeout]
timeout: 7200
gcode:
    {% if printer.pause_resume.is_paused %}
      M117 Idle timeout - paused print, keeping steppers
    {% else %}
      TURN_OFF_HEATERS
      M84
    {% endif %}

[mcu]
canbus_uuid: 486555826296

[mcu EBBCan]
canbus_uuid: b188d282d582

[save_variables]
filename: ~/printer_data/config/variables.cfg

[virtual_sdcard]
path: /home/dcruver/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
# bed_size: 350, 350
kinematics: corexy
max_velocity: 300  
max_accel: 4000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[include printer/heater_bed.cfg]

[include printer/extruder.cfg]

[include printer/fans.cfg]

[include printer/probe.cfg]

[include printer/steppers.cfg]


[exclude_object]


[gcode_macro FULL_BED_MESH]
gcode:
    M140 S60                     ; start bed heating
    G28                          ; home all axes
    ; Check for filament before proceeding
    {% if not printer["filament_switch_sensor sfs_switch"].filament_detected %}
      {action_respond_info("ERROR: No filament detected! Load filament and try again.")}
      CANCEL_PRINT
    {% endif %}
    M190 S60                     ; wait for bed temp
    QUAD_GANTRY_LEVEL
    G28 Z                        ; re-home Z after QGL
    BED_MESH_CALIBRATE
[gcode_shell_command ntfy_no_filament]
command: curl -s -X POST "http://ntfy-backend.cruver.network:80/troodon-alerts" -H "Title: 🚫 No Filament — Troodon" -H "Priority: high" -H "Tags: warning" -d "No filament detected. Print was aborted before starting."
timeout: 5
verbose: False

[gcode_macro _CHECK_FILAMENT]
gcode:
    {% if not printer["filament_switch_sensor sfs_switch"].filament_detected %}
      RUN_SHELL_COMMAND CMD=ntfy_no_filament
      _ABORT_NO_FILAMENT
    {% endif %}

[gcode_macro _ABORT_NO_FILAMENT]
gcode:
    {action_raise_error("No filament detected! Load filament and try again.")}

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(220)|float %}
    M140 S{BED_TEMP}            ; start bed heating
    G28                          ; home all axes
    _CHECK_FILAMENT
    M190 S{BED_TEMP}            ; wait for bed temp
    QUAD_GANTRY_LEVEL
    G28 Z                        ; re-home Z after QGL
    ; Adaptive mesh: probes only the area under the objects the slicer
    ; defined (EXCLUDE_OBJECT_DEFINE), falls back to a full mesh if none.
    BED_MESH_CALIBRATE ADAPTIVE=1
    SET_GCODE_OFFSET Z=0.01      ; Z offset (raised from -0.250, was too aggressive)
    G90                          ; absolute positioning
    G1 Z5 F3000                  ; move nozzle up
    G1 X5 Y5 F5000              ; move to front corner
    M109 S{EXTRUDER_TEMP}       ; wait for extruder temp
    SFS_ENABLE                   ; enable filament sensor
    G92 E0                       ; reset extruder
    G1 Z0.3 F300                 ; move to start height
    G1 X50 E10 F1500            ; purge line
    G92 E0                       ; reset extruder

[gcode_macro PRINT_END]
gcode:
    M400                         ; wait for moves to finish
    SFS_DISABLE                  ; disable filament sensor
    G92 E0                       ; reset extruder
    G1 E-5.0 F1800              ; retract filament
    G91                          ; relative positioning
    G1 Z10 F3000                 ; raise nozzle
    G90                          ; absolute positioning
    G1 X175 Y340 F5000          ; present print
    TURN_OFF_HEATERS
    M107                         ; turn off fan
    M84                          ; disable motors

