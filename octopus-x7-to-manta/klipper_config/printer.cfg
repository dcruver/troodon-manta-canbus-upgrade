[include fluidd.cfg]

[mcu]
canbus_uuid: 486555826296

[mcu EBBCan]
canbus_uuid: b188d282d582

[virtual_sdcard]
path: /home/dcruver/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
# bed_size: 350, 350
kinematics: corexy
max_velocity: 300  
max_accel: 4000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[include printer/heater_bed.cfg]

[include printer/extruder.cfg]

[include printer/fans.cfg]

[include printer/probe.cfg]

[include printer/steppers.cfg]


[exclude_object]


[gcode_macro FULL_BED_MESH]
gcode:
    M140 S60                     ; start bed heating
    G28                          ; home all axes
    M190 S60                     ; wait for bed temp
    QUAD_GANTRY_LEVEL
    G28 Z                        ; re-home Z after QGL
    BED_MESH_CALIBRATE
[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(220)|float %}
    M140 S{BED_TEMP}            ; start bed heating
    G28                          ; home all axes
    M190 S{BED_TEMP}            ; wait for bed temp
    QUAD_GANTRY_LEVEL
    G28 Z                        ; re-home Z after QGL
    BED_MESH_PROFILE LOAD=default
    G90                          ; absolute positioning
    G1 Z5 F3000                  ; move nozzle up
    G1 X5 Y5 F5000              ; move to front corner
    M109 S{EXTRUDER_TEMP}       ; wait for extruder temp
    SFS_ENABLE                   ; enable filament sensor
    G92 E0                       ; reset extruder
    G1 Z0.3 F300                 ; move to start height
    G1 X50 E10 F1500            ; purge line
    G92 E0                       ; reset extruder

[gcode_macro PRINT_END]
gcode:
    M400                         ; wait for moves to finish
    SFS_DISABLE                  ; disable filament sensor
    G92 E0                       ; reset extruder
    G1 E-5.0 F1800              ; retract filament
    G91                          ; relative positioning
    G1 Z10 F3000                 ; raise nozzle
    G90                          ; absolute positioning
    G1 X175 Y340 F5000          ; present print
    TURN_OFF_HEATERS
    M107                         ; turn off fan
    M84                          ; disable motors

