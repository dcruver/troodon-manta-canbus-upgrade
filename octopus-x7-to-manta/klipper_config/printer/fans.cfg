## Part Cooling Fan (Connected to SB0000 VFAN2)
[fan]
pin: EBBCan:PA1  # FAN2 PWM on SB0000
kick_start_time: 0.5
off_below: 0.10

## Hotend Fan (Auto-on at 50°C, Connected to SB0000 VFAN1)
[heater_fan hotend_fan]
pin: EBBCan:PA0  # FAN1 PWM on SB0000
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

## Electronics Case Fan (Always On)
[fan_generic electronics_fan]
pin: PF6  # VF2 on Manta M8P V2
kick_start_time: 0.5

[delayed_gcode start_electronics_fan]
initial_duration: 1
gcode:
    SET_FAN_SPEED FAN=electronics_fan SPEED=1.0

## Exhaust Fan (VF3 on Manta M8P V2)
[fan_generic exhaust_fan]
pin: PF8  # VF3 on Manta M8P V2
kick_start_time: 0.5

## Case LED (VF0 on Manta M8P V2)
[output_pin case_led]
pin: PF7  # VF0 on Manta M8P V2
value: 1
shutdown_value: 0

## BTT Smart Filament Sensor V2.0
## Switch sensor on M5-STOP, Motion sensor on M6-STOP
[filament_switch_sensor sfs_switch]
switch_pin: ^PF0  # M5-STOP on Manta M8P V2
pause_on_runout: False
runout_gcode:
    PAUSE
    M117 Filament runout detected!
insert_gcode:
    M117 Filament inserted.

[filament_motion_sensor sfs_motion]
switch_pin: ^PC15  # M6-STOP on Manta M8P V2
detection_length: 10
extruder: extruder
pause_on_runout: True
runout_gcode:
    PAUSE
    M117 Filament motion stopped!
insert_gcode:
    M117 Filament encoder inserted.

## Disable filament sensors on startup to prevent false triggers
[delayed_gcode disable_sfs_on_startup]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=0

[gcode_macro SFS_ENABLE]
description: Enable smart filament sensor
gcode:
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=1

[gcode_macro SFS_DISABLE]
description: Disable smart filament sensor
gcode:
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=0
