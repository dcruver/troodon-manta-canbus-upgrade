## Part Cooling Fan (Connected to SB0000 VFAN2)
[fan]
pin: EBBCan:PA1  # FAN2 PWM on SB0000
kick_start_time: 0.5
off_below: 0.10

## Hotend Fan (Auto-on at 50°C, Connected to SB0000 VFAN1)
[heater_fan hotend_fan]
pin: EBBCan:PA0  # FAN1 PWM on SB0000
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

## Electronics Case Fan (Always On)
[fan_generic electronics_fan]
pin: PF6  # VF2 on Manta M8P V2
kick_start_time: 0.5

[delayed_gcode start_electronics_fan]
initial_duration: 1
gcode:
    SET_FAN_SPEED FAN=electronics_fan SPEED=1.0

## Exhaust Fan (VF3 on Manta M8P V2)
[fan_generic exhaust_fan]
pin: PF8  # VF3 on Manta M8P V2
kick_start_time: 0.5

## Case LED (VF0 on Manta M8P V2)
[output_pin case_led]
pin: PF7  # VF0 on Manta M8P V2
value: 1
shutdown_value: 0

